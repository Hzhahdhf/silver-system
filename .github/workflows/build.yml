name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15
          - name: iOS
            os: macos-15
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.name == 'iOS' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        if: matrix.config.name != 'iOS'
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          sdk: "5.11.2"

      - name: Build the mod (iOS)
        if: matrix.config.name == 'iOS'
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: iOS
          sdk: nightly
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          build-args: -DSKIP_BUILDING_CODEGEN=ON

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
